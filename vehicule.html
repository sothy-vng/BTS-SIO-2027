<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title> Inscription Nouveau Client - Méditerranée </title>
</head>
<body background="gt3rs.jpg">
<center>
<font color="white">
	<section>
		<form action="#" method="post">

			<h1> Choix de votre véhicule </h1>
			<label for="marque"> Marque : </label>
			<select id ="marque" name="marque">
				<option value="peugeot"> Peugeot </option>
				<option value="mercedes"> Mercedes </option>
				<option value="renault"> Renault </option>
			</select>
			<br>
			<label for="immatriculation"> Immatriculation : </label>
			<input type="text" id ="immatriculation" name="immatriculation">
			<br>
			<label for="couleur"> Couleur : </label>
			<input type="text" id ="couleur" name="couleur">
			<br>
			<label for="date_immatriculation"> Date d'immatriculation : </label>
			<input type="date" id ="date_immatriculation" name="date_immatriculation">
			<br>
			<label for="kilometrage"> Kilométrage : </label>
			<input type="number" id ="kilometrage" name="kilometrage">
			<br>
			<p>	État : </p>
			<label for="etat"> Occasion </label>
			<input type="radio" id ="occasion" name="etat">
			<label for="etat"> Neuve </label>
			<input type="radio" id ="neuve" name="etat">
			<br>
			<p>	Carburant : </p>
			<label for="hybride"> Hybride </label>
			<input type="radio" id ="hybride" name="carburant">
			<label for="electrique"> Électrique </label>
			<input type="radio" id ="electrique" name="carburant">
			<label for="diesel"> Diesel </label>
			<input type="radio" id ="diesel" name="carburant">
			<label for="essence"> Essence </label>
			<input type="radio" id ="essence" name="carburant">
			<br>
			<p>	Boîte de vitesses : </p>
			<label for="bdv"> Automaique </label>
			<input type="radio" id ="automatique" name="bdv">
			<label for="bdv"> Manuelle </label>
			<input type="radio" id ="manuelle" name="bdv">
			<br>
			<label for="portes"> Nombre de portes : </label>
			<select id ="portes" name="portes">
				<option value="2"> 2 portes </option>
				<option value="3"> 3 portes </option>
				<option value="4"> 4 portes </option>
				<option value="5"> 5 portes </option>
				<option value="6+"> 6 portes ou plus </option>
			</select>
			<br>
			<label for="puissance"> Puissance : </label>
			<select id ="puissance" name="puissance">
				<option value="~90"> ~90 chevaux </option>
				<option value="~200"> ~200 chevaux </option>
				<option value="+1000"> +1000 chevaux </option>
			</select>
			<br>
			<p>	Bonne affaire : </p>
			<label for="ba"> Très bonne affaire </label>
			<input type="radio" id ="tres_bonne_affaire" name="ba">
			<label for="ba"> Bonne affaire </label>
			<input type="radio" id ="bonne_affaire" name="ba">
			<label for="ba"> Offre équitable </label>
			<input type="radio" id ="offre_equitable" name="ba">
			<br>
    	    <button type="submit"> Ennregistrer </button>
        	<button type="reset"> Annuler </button>

		</form>	
	</section>

	<footer>
		<p> &copy; 2026 Agence Méditerranée - Location de véhicules </p>
	</footer>
</font>

<HR> <br>

<a href="index.html"> Retour au Sommaire </a>	
</center>
</body>
</html>
