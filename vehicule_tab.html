<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title> Inscription Nouveau Client - Méditerranée </title>
</head>
<body background="gt3rs.jpg">
<center>
<font color="white">
	<section>
		<form action="#" method="post">

			<h1> Choix de votre véhicule </h1>
			<table>
				<tr> 
					<td> <label for="marque"> Marque : </label> </td>
					<td> <select id ="marque" name="marque">
						 	<option value="peugeot"> Peugeot </option>
							<option value="mercedes"> Mercedes </option>
							<option value="renault"> Renault </option>
						</select> </td>
				</tr>
				<tr> 
					<td> <label for="immatriculation">Immatriculation : </label> </td>
					<td> <input type="text" id ="immatriculation" name="immatriculation"> </td>
				</tr>
				<tr> 
					<td> <label for="couleur"> Couleur : </label> </td>
					<td> <input type="text" id ="couleur" name="couleur"> </td>
				</tr>
				<tr> 
					<td> <label for="date_immatriculation"> Date d'immatriculation : </label> </td>
					<td> <input type="date" id ="date_immatriculation" name="date_immatriculation"> </td>
				</tr>
				<tr> 
					<td> <label for="kilometrage"> Kilométrage : </label> </td>
					<td> <input type="number" id ="kilometrage" name="kilometrage"> </td>
				</tr>
				<tr> 
					<td> <p> État : </p> </td>
					<td> <label for="etat"> Occasion </label>
						 <input type="radio" id ="occasion" name="etat">
						 <label for="etat"> Neuve </label>
						 <input type="radio" id ="neuve" name="etat"> </td>
				</tr>
				<tr> 
					<td> <p> Carburant : </p> </td>
					<td> <label for="hybride"> Hybride </label>
						 <input type="radio" id ="hybride" name="carburant">
						 <label for="electrique"> Électrique </label>
						 <input type="radio" id ="electrique" name="carburant">
				  		 <label for="diesel"> Diesel </label>
					 	 <input type="radio" id ="diesel" name="carburant">
						 <label for="essence"> Essence </label>
						 <input type="radio" id ="essence" name="carburant"> </td>
				</tr>
				<tr> 
					<td> <p> Boîte de vitesses : </p> </td>
					<td> <label for="bdv"> Automaique </label>
						 <input type="radio" id ="automatique" name="bdv">
						 <label for="bdv"> Manuelle </label>
						 <input type="radio" id ="manuelle" name="bdv"> </td>
				</tr>
	 				<tr> 
					<td> <label for="portes"> Nombre de portes : </label> </td>
					<td> <select id ="portes" name="portes">
							<option value="2"> 2 portes </option>
							<option value="3"> 3 portes </option>
							<option value="4"> 4 portes </option>
							<option value="5"> 5 portes </option>
							<option value="6+"> 6 portes ou plus </option>
						 </select> </td>
				</tr>
				<tr> 
					<td> <label for="puissance"> Puissance : </label> </td>
						<td> <select id ="puissance" name="puissance">
								<option value="~90"> ~90 chevaux </option>
								<option value="~200"> ~200 chevaux </option>
								<option value="+1000"> +1000 chevaux </option>
							 </select> </td>
				</tr>
				<tr> 
					<td> <p>	Bonne affaire : </p> </td>
					<td> <label for="ba"> Très bonne affaire </label>
						 <input type="radio" id ="tres_bonne_affaire" name="ba">
						 <label for="ba"> Bonne affaire </label>
						 <input type="radio" id ="bonne_affaire" name="ba">
						 <label for="ba"> Offre équitable </label>
						 <input type="radio" id ="offre_equitable" name="ba"> </td>
				</tr>
				<tr> 
					<td> <button type="submit"> Ennregistrer </button> </td>
					<td> <button type="reset"> Annuler </button> </td>
				</tr>
        	</table>

		</form>	
	</section>

	<footer>
		<p> &copy; 2026 Agence Méditerranée - Location de véhicules </p>
	</footer>
</font>

<HR> <br>

<a href="index.html"> Retour au Sommaire </a>	
</center>
</body>
</html>
